apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: azure-kv-store
spec:
  provider:
    azurekv:
      tenantId: "${AZURE_TENANT_ID}"
      vaultUrl: "${AZURE_VAULT_URL}"
      authSecretRef:
        clientId:
          name: azure-secret
          key: ClientID
        clientSecret:
          name: azure-secret
          key: ClientSecret
