apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-auth
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: SecretStore

  target:
    name: postgres-auth
    creationPolicy: Owner

  data:
    - secretKey: postgres-password
      remoteRef:
        key: postgres-admin-password

    - secretKey: password
      remoteRef:
        key: db-password
