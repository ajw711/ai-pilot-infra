apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: r2-credentials
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-store
    kind: SecretStore

  target:
    name: r2-credentials
    creationPolicy: Owner

  data:
    - secretKey: account-id
      remoteRef:
        key: r2-account-id

    - secretKey: access-key-id
      remoteRef:
        key: r2-access-key-id

    - secretKey: secret-access-key
      remoteRef:
        key: r2-secret-access-key
