apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-backup-script
  namespace: default
data:
  dump.sh: |
    #!/bin/sh
    set -e
    TIMESTAMP=$(date +%Y%m%d-%H%M%S)
    echo "${TIMESTAMP}" > /backup/timestamp.txt
    FILENAME="backup-${TIMESTAMP}.sql.gz"

    echo "[1/2] pg_dump 시작..."
    PGPASSWORD="${DB_PASSWORD}" pg_dump \
      -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}" -d "${DB_NAME}" \
      --format=plain --no-owner --no-privileges \
      | gzip > "/backup/${FILENAME}"

    echo "[2/2] 파일 크기 확인..."
    ls -lh "/backup/${FILENAME}"

  upload.sh: |
    #!/bin/sh
    set -e
    TIMESTAMP=$(cat /backup/timestamp.txt)
    FILENAME="backup-${TIMESTAMP}.sql.gz"

    echo "R2 업로드 중: ${FILENAME}"
    aws s3 cp "/backup/${FILENAME}" \
      "s3://${R2_BUCKET}/postgres/${FILENAME}" \
      --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

    echo "백업 완료: ${FILENAME}"

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: default
spec:
  schedule: "0 18 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          initContainers:
            - name: dump
              image: postgres:18-alpine
              command: ["/bin/sh", "/scripts/dump.sh"]
              env:
                - name: DB_HOST
                  value: "postgres-postgresql"
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: "ai_pilot"
                - name: DB_USER
                  value: "postgres"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-auth
                      key: password
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: backup-tmp
                  mountPath: /backup
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          containers:
            - name: upload
              image: amazon/aws-cli:2.17.0
              command: ["/bin/sh", "/scripts/upload.sh"]
              env:
                - name: R2_BUCKET
                  value: "ai-pilot-db-backup"
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: account-id
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: access-key-id
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: r2-credentials
                      key: secret-access-key
                - name: AWS_DEFAULT_REGION
                  value: "auto"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                - name: backup-tmp
                  mountPath: /backup
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 300m
                  memory: 256Mi
          volumes:
            - name: script
              configMap:
                name: pg-backup-script
                defaultMode: 0755
            - name: backup-tmp
              emptyDir: {}
