apiVersion: v1
kind: Service
metadata:
  name: {{ include "ai-pilot-frontend.fullname" . }}
  labels:
    {{- include "ai-pilot-frontend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: 
    {{- include "ai-pilot-frontend.selectorLabels" . | nindent 4 }} 
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "ai-pilot-frontend.selectorLabels" . | nindent 4 }}
