apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-role

rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
      - namespaces
      - services
    verbs:
      - get
      - list

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-binding

subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: default

roleRef:
  kind: ClusterRole
  name: cluster-agent-role
  apiGroup: rbac.authorization.k8s.io
