apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-agent-role

rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - namespaces
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - apps
    resources:
      - deployments
      - deployments/scale
    verbs:
      - get
      - list
      - watch
      - update
      - patch


---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-agent-binding

subjects:
  - kind: ServiceAccount
    name: cluster-agent
    namespace: default

roleRef:
  kind: ClusterRole
  name: cluster-agent-role
  apiGroup: rbac.authorization.k8s.io
