apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ai-pilot
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-pilot
      app.kubernetes.io/instance: ai-pilot
  namespaceSelector:
    matchNames:
      - default
  endpoints:
    - port: actuator
      path: /actuator/prometheus
      interval: 15s
