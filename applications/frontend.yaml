apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-pilot-frontend
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/ajw711/ai-pilot-infra
    targetRevision: main
    path: charts/ai-pilot-frontend

    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
